<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hệ Thống Thi Trắc Nghiệm - Tết Trung Thu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    .radio-custom:checked + div { border-color: #3b82f6; background-color: #eff6ff; }
    .radio-custom:checked + div .circle { background-color: #3b82f6; border-color: #3b82f6; }
    .nav-item.answered { background-color: #3b82f6; color: white; border-color: #3b82f6; }
    .correct-ans { background-color: #dcfce7 !important; border-color: #22c55e !important; }
    .wrong-ans { background-color: #fee2e2 !important; border-color: #ef4444 !important; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body class="text-gray-800 h-screen flex flex-col overflow-hidden">

  <!-- Header -->
  <header class="bg-white shadow-sm border-b border-gray-200 sticky top-0 z-50 flex-shrink-0">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="text-2xl">🏮</span>
        <h1 class="font-bold text-lg hidden sm:block text-blue-900">Kỳ Thi Kiến Thức Trung Thu</h1>
        <h1 class="font-bold text-lg sm:hidden text-blue-900">Thi Trung Thu</h1>
      </div>
      
      <div class="flex items-center gap-4">
        <div class="flex items-center bg-gray-100 rounded-lg px-3 py-1.5 border border-gray-200">
          <svg class="w-5 h-5 text-gray-500 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span id="timer" class="font-mono font-bold text-lg text-red-600">30:00</span>
        </div>
        <button id="btn-submit-top" onclick="confirmSubmit()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-1.5 px-4 rounded-lg transition-colors shadow-sm">
          Nộp Bài
        </button>
      </div>
    </div>
  </header>

  <!-- Giao diện chính -->
  <main class="flex-1 max-w-7xl mx-auto w-full flex flex-col md:flex-row overflow-hidden relative">
    
    <!-- Cột trái: Nội dung câu hỏi -->
    <div id="quiz-container" class="flex-1 overflow-y-auto p-4 sm:p-6 bg-gray-50 relative pb-32">
      <div id="questions-wrapper" class="max-w-3xl mx-auto space-y-6">
        <!-- Câu hỏi render tại đây -->
      </div>
      
      <div class="max-w-3xl mx-auto mt-8 text-center" id="bottom-submit-zone">
        <button onclick="confirmSubmit()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-xl shadow-lg transition-transform transform active:scale-95">
          Hoàn Thành & Nộp Bài
        </button>
      </div>

      <!-- Bảng kết quả -->
      <div id="result-board" class="hidden max-w-3xl mx-auto mt-8 bg-white rounded-2xl shadow-xl p-6 sm:p-8 text-center border-t-4 border-blue-500 mb-12">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">Kết Quả Bài Thi</h2>
        
        <!-- Chỉ số kết quả -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 my-6">
          <div class="bg-blue-50 rounded-2xl p-4 border border-blue-100 flex flex-col items-center justify-center">
            <p class="text-gray-500 text-xs uppercase font-bold tracking-wider">Điểm Số (Thang 10)</p>
            <p class="text-4xl sm:text-5xl font-black text-blue-600 mt-2" id="score-10-display">0 / 10</p>
          </div>
          <div class="bg-green-50 rounded-2xl p-4 border border-green-100 flex flex-col items-center justify-center">
            <p class="text-gray-500 text-xs uppercase font-bold tracking-wider">Số Câu Đúng</p>
            <p class="text-3xl sm:text-4xl font-bold text-green-600 mt-2" id="score-display">0/30</p>
          </div>
          <div class="bg-amber-50 rounded-2xl p-4 border border-amber-100 flex flex-col items-center justify-center">
            <p class="text-gray-500 text-xs uppercase font-bold tracking-wider">Thời Gian Làm</p>
            <p class="text-3xl sm:text-4xl font-bold text-amber-600 mt-2" id="time-taken">00:00</p>
          </div>
        </div>

        <p id="result-message" class="text-lg text-gray-700 font-medium my-6"></p>

        <button onclick="initQuiz()" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 px-8 rounded-xl shadow-md transition-all active:scale-95">
          🔄 Làm Lại Đề Mới (Xáo Trộn)
        </button>
      </div>
    </div>

    <!-- Cột phải: Bảng điều hướng -->
    <div class="w-full md:w-72 bg-white border-t md:border-t-0 md:border-l border-gray-200 flex flex-col flex-shrink-0 z-30 md:static fixed bottom-0 left-0 right-0 shadow-[0_-4px_10px_rgba(0,0,0,0.1)] md:shadow-none">
      <div class="p-3 bg-gray-100 md:bg-gray-50 border-b border-gray-200 flex justify-between items-center cursor-pointer md:cursor-auto" onclick="toggleNavMobile()">
        <h3 class="font-bold text-gray-700 text-xs md:text-sm uppercase tracking-wider">Danh sách câu hỏi</h3>
        <span class="md:hidden text-blue-600 text-xs font-semibold bg-blue-50 px-2 py-1 rounded border border-blue-200" id="nav-toggle-text">Mở rộng ▴</span>
      </div>
      
      <div id="nav-grid" class="flex-1 overflow-y-auto p-4 hidden md:block max-h-60 md:max-h-none bg-white transition-all">
        <div class="grid grid-cols-5 gap-2" id="nav-buttons">
          <!-- Bảng câu hỏi -->
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Xác nhận nộp bài -->
  <div id="confirm-modal" class="hidden fixed inset-0 bg-black/60 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
    <div class="bg-white rounded-2xl p-6 w-full max-w-sm shadow-2xl">
      <h3 class="text-xl font-bold text-gray-900 mb-2">Xác nhận nộp bài?</h3>
      <p class="text-gray-600 mb-6" id="unanswered-warning"></p>
      <div class="flex justify-end gap-3">
        <button onclick="closeModal()" class="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg">Kiểm tra lại</button>
        <button onclick="submitQuiz()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Nộp Bài Ngay</button>
      </div>
    </div>
  </div>

  <script>
    const dbQuestions = [
      { q: "Tết Trung Thu diễn ra vào ngày Âm lịch nào hàng năm?", o: ["Rằm tháng Tám", "Rằm tháng Bảy", "Mùng 1 tháng Tám", "Rằm tháng Chạp"] },
      { q: "Nhân vật nào ngồi dưới gốc cây đa trên mặt trăng?", o: ["Chú Cuội", "Thạch Sanh", "Chử Đồng Tử", "Thánh Gióng"] },
      { q: "Người đẹp sống trên Cung Trăng là ai?", o: ["Hằng Nga", "Mị Nương", "Tiên Dung", "Thánh Mẫu"] },
      { q: "Bánh Trung Thu truyền thống gồm 2 loại chính nào?", o: ["Bánh nướng & Bánh dẻo", "Bánh chưng & giầy", "Bánh pía & in", "Bánh trôi & chay"] },
      { q: "Đồ chơi truyền thống bằng giấy kiếng đỏ hình ngôi sao là gì?", o: ["Đèn ông sao", "Đèn kéo quân", "Tò he", "Mặt nạ giấy bồi"] },
      { q: "Hoạt động múa nào diễn ra trên đường phố đêm Trung Thu?", o: ["Múa Lân", "Múa rối nước", "Múa sạp", "Múa quạt"] },
      { q: "Tết Trung Thu còn có tên gọi phổ biến nào khác?", o: ["Tết Thiếu nhi / Tết Đoàn viên", "Tết Nguyên tiêu", "Tết Hàn thực", "Tết Trùng cửu"] },
      { q: "Bánh dẻo truyền thống làm từ bột gì?", o: ["Bột nếp rang chín", "Bột mì", "Bột gạo tẻ", "Bột sắn dây"] },
      { q: "Bánh nướng hình tròn tượng trưng cho điều gì?", o: ["Sự viên mãn, trọn vẹn gia đình", "Trái đất", "Mặt trời", "Sự giàu có"] },
      { q: "Con vật nào biểu tượng cho mặt trăng trong thần thoại châu Á?", o: ["Thỏ Ngọc", "Sói bạc", "Cáo 9 đuôi", "Rồng xanh"] },
      { q: "Loại quả không thể thiếu trong mâm cỗ Trung thu miền Bắc?", o: ["Quả bưởi (chó bưởi)", "Quả dưa hấu", "Quả xoài", "Quả vải"] },
      { q: "Đèn kéo quân có đặc điểm gì đặc biệt?", o: ["Có các hình bóng xoay tròn khi thắp nến", "Biết bay lên trời", "Phát ra âm thanh", "Làm bằng vỏ bưởi"] },
      { q: "Đồ chơi Tò He truyền thống được làm từ gì?", o: ["Bột gạo tẻ pha nếp nhuộm màu", "Đất sét", "Sáp ong", "Nhựa mủ cây"] },
      { q: "Bài hát 'Chiếc đèn ông sao' do ai sáng tác?", o: ["Phạm Tuyên", "Trịnh Công Sơn", "Văn Cao", "Phong Nhã"] },
      { q: "Trẻ em đi ăn bánh kẹo dưới trăng gọi là gì?", o: ["Phá cỗ", "Du xuân", "Trẩy hội", "Hái lộc"] },
      { q: "Vì sao chú Cuội phải bay lên cung trăng?", o: ["Cây đa thần bay lên trời vì bị tưới nước bẩn", "Được tiên nữ mời", "Đi tìm thuốc trường sinh", "Trốn nợ"] },
      { q: "Sự tích Hằng Nga liên quan đến ai bắn rụng 9 mặt trời?", o: ["Hậu Nghệ", "Địch Thanh", "Lý Tịnh", "Na Tra"] },
      { q: "Ông Địa trong múa Lân thường cầm vật gì?", o: ["Quạt mo / Quạt nan", "Đèn lồng", "Trống", "Cành tre"] },
      { q: "Tết Trung Thu của Hàn Quốc gọi là gì?", o: ["Chuseok", "Tsukimi", "Obon", "Songkran"] },
      { q: "Vỏ bánh nướng thường quét lớp gì trước khi nướng?", o: ["Lòng đỏ trứng gà", "Mật ong", "Dầu ăn", "Nước đường"] },
      { q: "Món đồ chơi phát tiếng 'lạch cạch' trong đêm Trung thu?", o: ["Trống ếch / Trống bỏi", "Sáo trúc", "Đàn bầu", "Mõ sừng"] },
      { q: "Quốc gia nào KHÔNG coi Trung thu là lễ hội lớn?", o: ["Mỹ", "Việt Nam", "Trung Quốc", "Hàn Quốc"] },
      { q: "Hương vị trộn vào vỏ bánh dẻo truyền thống là gì?", o: ["Nước hoa bưởi", "Vani", "Tinh dầu dâu", "Nước cốt dừa"] },
      { q: "Múa sư tử và múa lân khác nhau ở điểm nào?", o: ["Lân có một sừng, sư tử không sừng", "Lân màu vàng, sư đỏ", "Sư tử múa 2 người, lân 1", "Sư tử có đuôi dài hơn"] },
      { q: "Vào đêm Trung thu, mọi người thường làm gì?", o: ["Đoàn tụ gia đình, ăn bánh thưởng trăng", "Tổ chức đi du lịch xa", "Đi tảo mộ", "Đi chúc tết họ hàng"] },
      { q: "Tết Trung thu bắt nguồn từ nền văn minh nào?", o: ["Văn minh lúa nước Á Đông", "Văn minh Lưỡng Hà", "Văn minh phương Tây", "Văn minh sông Nile"] },
      { q: "Tại sao mâm cỗ Trung thu lại hay có con chó làm bằng múi bưởi?", o: ["Vì bưởi chín rộ vào mùa thu", "Vì chó là bạn của chú Cuội", "Vì xua đuổi tà ma", "Vì Hằng Nga thích chó"] },
      { q: "Theo bài hát 'Rước đèn tháng Tám', đèn có những hình gì?", o: ["Đèn ông sao, đèn cá chép, đèn bươm bướm", "Đèn lồng đỏ, đèn hoa sen", "Đèn kéo quân, đèn trời", "Đèn lồng tròn, đèn vuông"] },
      { q: "Hình ảnh Hằng Nga mang ý nghĩa gì trong dân gian?", o: ["Biểu tượng của vẻ đẹp và mặt trăng", "Nữ thần nông nghiệp", "Bà chúa mùa màng", "Thần tình yêu"] },
      { q: "Lễ hội Trung Thu nổi tiếng nhất ở Tuyên Quang có đặc trưng gì?", o: ["Rước các mô hình đèn lồng khổng lồ", "Múa Lân dài nhất Việt Nam", "Đua thuyền rồng", "Thả hàng vạn hoa đăng trên sông"] },
      { q: "Trong các loại hạt sau, hạt nào hay xuất hiện nhất ở nhân bánh thập cẩm?", o: ["Hạt dưa, hạt bí", "Hạt hướng dương", "Hạt dẻ cười", "Hạt óc chó"] },
      { q: "Người Nhật Bản ăn bánh gì vào dịp ngắm trăng?", o: ["Tsukimi Dango", "Mochi", "Sushi", "Dorayaki"] },
      { q: "Bánh Trung Thu của Trung Quốc gọi là gì?", o: ["Nguyệt bính (Yuebing)", "Bánh mặt trời", "Màn thầu", "Sủi cảo"] },
      { q: "Bài hát nào có câu: 'Bóng trăng trắng ngà, có cây đa to'?", o: ["Thằng Cuội", "Chiếc đèn ông sao", "Rước đèn tháng Tám", "Gọi trăng"] },
      { q: "Nhân vật nào hay đi theo trêu chọc Lân trong lúc múa?", o: ["Ông Địa bụng phệ", "Chú Tễu", "Tôn Ngộ Không", "Thần Tài"] },
      { q: "Vì sao múa Lân thường múa 2 con (Song Lân)?", o: ["Tượng trưng cho sự hài hòa, phu thê, may mắn", "Vì 1 con nhảy không đẹp", "Để thi đấu với nhau", "Vì Lân luôn sinh đôi"] },
      { q: "Trái nào sau đây thường được tỉa thành hình hoa trong mâm cỗ?", o: ["Trái thanh long / dưa hấu", "Trái chuối", "Trái sầu riêng", "Trái dừa"] },
      { q: "Món xôi nào thường được cúng trong dịp Trung Thu ở nhiều vùng Bắc Bộ?", o: ["Xôi cốm", "Xôi gấc", "Xôi xéo", "Xôi đỗ đen"] },
      { q: "Trong dịp Trung thu, người ta thường uống nước gì cùng với ăn bánh?", o: ["Trà xanh / Trà mạn", "Nước ngọt có gas", "Rượu vang", "Cà phê"] },
      { q: "Đèn cù (đèn ông sư) được làm từ nguyên liệu gì?", o: ["Giấy bóng kính, tre và có bánh xe", "Vỏ hộp xà phòng", "Lon bia cắt mỏng", "Vỏ bưởi khoét ruột"] }
    ];

    const QUESTIONS_PER_QUIZ = 30;
    const QUIZ_TIME_MINUTES = 30; // Cấu hình thời gian thi 30 phút

    let questions = [];
    let userAnswers = {};
    let timeSeconds = QUIZ_TIME_MINUTES * 60;
    let timerInterval;
    let isSubmitted = false;

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function formatTime(secs) {
      let m = Math.floor(secs / 60);
      let s = secs % 60;
      return `${m < 10 ? '0'+m : m}:${s < 10 ? '0'+s : s}`;
    }

    function initQuiz() {
      isSubmitted = false;
      userAnswers = {};
      timeSeconds = QUIZ_TIME_MINUTES * 60;
      document.getElementById('result-board').classList.add('hidden');
      document.getElementById('bottom-submit-zone').classList.remove('hidden');
      document.getElementById('btn-submit-top').classList.remove('hidden');
      
      let shuffledDb = shuffle(dbQuestions);
      let selectedDb = shuffledDb.slice(0, Math.min(QUESTIONS_PER_QUIZ, dbQuestions.length));
      
      questions = selectedDb.map((q, id) => {
        let opts = q.o.map((text, index) => ({ text, isCorrect: index === 0 }));
        return { id, q: q.q, opts: shuffle(opts) };
      });

      renderQuestions();
      renderNavigator();
      
      document.getElementById('quiz-container').scrollTo(0, 0);

      clearInterval(timerInterval);
      document.getElementById('timer').textContent = formatTime(timeSeconds);
      timerInterval = setInterval(() => {
        timeSeconds--;
        document.getElementById('timer').textContent = formatTime(timeSeconds);
        if (timeSeconds <= 0) {
          clearInterval(timerInterval);
          alert("⏰ Đã hết thời gian làm bài! Hệ thống tự động nộp bài.");
          submitQuiz();
        }
      }, 1000);
    }

    function renderQuestions() {
      const container = document.getElementById('questions-wrapper');
      let html = '';
      questions.forEach((item, index) => {
        html += `
          <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-5 sm:p-7" id="question-card-${index}">
            <div class="flex gap-3 mb-4">
              <span class="bg-blue-100 text-blue-700 font-bold w-8 h-8 rounded-full flex items-center justify-center flex-shrink-0">${index + 1}</span>
              <h3 class="text-gray-800 font-semibold text-lg pt-1">${item.q}</h3>
            </div>
            <div class="space-y-3 ml-0 sm:ml-11">
              ${item.opts.map((opt, oIndex) => `
                <label class="relative block cursor-pointer group" onclick="selectAnswer(${index}, ${oIndex})">
                  <input type="radio" name="q${index}" class="radio-custom sr-only" value="${oIndex}">
                  <div class="border border-gray-300 rounded-lg p-3.5 flex items-center transition-all group-hover:bg-gray-50" id="box_q${index}_o${oIndex}">
                    <div class="circle w-5 h-5 border-2 border-gray-400 rounded-full mr-3 flex-shrink-0 flex items-center justify-center">
                      <div class="w-2.5 h-2.5 bg-white rounded-full"></div>
                    </div>
                    <span class="text-gray-700">${opt.text}</span>
                  </div>
                </label>
              `).join('')}
            </div>
            <div id="feedback-${index}" class="hidden ml-0 sm:ml-11 mt-4 p-3 rounded-lg text-sm font-medium"></div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    function renderNavigator() {
      const navContainer = document.getElementById('nav-buttons');
      let html = '';
      for (let i = 0; i < questions.length; i++) {
        html += `<button onclick="scrollToQuestion(${i})" id="nav-btn-${i}" class="nav-item w-full aspect-square bg-white border border-gray-300 rounded-md font-semibold text-gray-600 hover:bg-gray-100">${i + 1}</button>`;
      }
      navContainer.innerHTML = html;
    }

    function selectAnswer(qIndex, oIndex) {
      if (isSubmitted) return;
      userAnswers[qIndex] = oIndex;
      document.getElementById(`nav-btn-${qIndex}`).classList.add('answered');
    }

    function scrollToQuestion(index) {
      const el = document.getElementById(`question-card-${index}`);
      if(el) {
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      if (window.innerWidth < 768) {
        document.getElementById('nav-grid').classList.add('hidden');
        document.getElementById('nav-toggle-text').innerText = "Mở rộng ▴";
      }
    }

    function toggleNavMobile() {
      if (window.innerWidth >= 768) return;
      const nav = document.getElementById('nav-grid');
      const text = document.getElementById('nav-toggle-text');
      if (nav.classList.contains('hidden')) {
        nav.classList.remove('hidden');
        text.innerText = "Thu gọn ▾";
      } else {
        nav.classList.add('hidden');
        text.innerText = "Mở rộng ▴";
      }
    }

    function confirmSubmit() {
      const answeredCount = Object.keys(userAnswers).length;
      const total = questions.length;
      if (answeredCount < total) {
        document.getElementById('unanswered-warning').innerHTML = `Bạn mới làm được <b>${answeredCount}/${total}</b> câu. Vẫn còn <span class="text-red-500 font-bold">${total - answeredCount}</span> câu chưa chọn.`;
      } else {
        document.getElementById('unanswered-warning').innerHTML = `Bạn đã hoàn thành 100% câu hỏi. Bạn có chắc chắn muốn nộp bài?`;
      }
      document.getElementById('confirm-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
    }

    function submitQuiz() {
      closeModal();
      clearInterval(timerInterval);
      isSubmitted = true;
      document.getElementById('bottom-submit-zone').classList.add('hidden');
      document.getElementById('btn-submit-top').classList.add('hidden');

      let score = 0;
      const total = questions.length;

      questions.forEach((q, qIndex) => {
        const userChoice = userAnswers[qIndex];
        const correctIndex = q.opts.findIndex(opt => opt.isCorrect);
        const fbEl = document.getElementById(`feedback-${qIndex}`);

        document.querySelectorAll(`input[name="q${qIndex}"]`).forEach(input => input.disabled = true);

        if (userChoice === correctIndex) {
          score++;
          document.getElementById(`box_q${qIndex}_o${userChoice}`).classList.add('correct-ans');
          document.getElementById(`nav-btn-${qIndex}`).style.backgroundColor = '#22c55e';
          document.getElementById(`nav-btn-${qIndex}`).style.borderColor = '#22c55e';
          fbEl.innerHTML = `✔️ <b>Chính xác!</b>`;
          fbEl.className = "ml-0 sm:ml-11 mt-4 p-3 rounded-lg text-sm bg-green-50 text-green-700 border border-green-200";
        } else {
          if (userChoice !== undefined) document.getElementById(`box_q${qIndex}_o${userChoice}`).classList.add('wrong-ans');
          document.getElementById(`box_q${qIndex}_o${correctIndex}`).classList.add('correct-ans');
          document.getElementById(`nav-btn-${qIndex}`).style.backgroundColor = '#ef4444';
          document.getElementById(`nav-btn-${qIndex}`).style.borderColor = '#ef4444';
          
          fbEl.innerHTML = `❌ <b>Sai.</b> Đáp án đúng: <b>${q.opts[correctIndex].text}</b>`;
          fbEl.className = "ml-0 sm:ml-11 mt-4 p-3 rounded-lg text-sm bg-red-50 text-red-700 border border-red-200";
        }
        fbEl.classList.remove('hidden');
      });

      let score10 = Math.round((score / total) * 100) / 10;

      document.getElementById('score-10-display').innerText = `${score10}`;
      document.getElementById('score-display').innerText = `${score}/${total}`;
      document.getElementById('time-taken').innerText = formatTime((QUIZ_TIME_MINUTES * 60) - timeSeconds);
      
      let msg = score10 >= 9 ? "🏆 Tốt lắm! Xuất sắc tuyệt đối!" : score10 >= 8 ? "🌟 Rất giỏi! Kiến thức của bạn rất vững." : score10 >= 5 ? "👍 Khá tốt! Đạt yêu cầu." : "💪 Hãy làm lại lần nữa để cải thiện điểm nhé!";
      document.getElementById('result-message').innerText = msg;
      
      const rb = document.getElementById('result-board');
      rb.classList.remove('hidden');
      rb.scrollIntoView({ behavior: 'smooth' });
    }

    initQuiz();
  </script>
</body>
</html>
