<!-- Thêm thư viện Firebase SDK (bản Web CDN) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
  // Cấu hình kết nối
  const firebaseConfig = {
    databaseURL: "https://dulieu-327e5-default-rtdb.asia-southeast1.firebasedatabase.app/"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // Hàm lưu điểm người chơi lên Bảng xếp hạng
  function saveScore(playerName, score, timeUsed) {
    db.ref('leaderboard').push({
      name: playerName,
      score: score,
      time: timeUsed,
      timestamp: Date.now()
    });
  }
</script>
