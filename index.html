<!DOCTYPE html>
<html lang="vi" class="notranslate" translate="no">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="google" content="notranslate">
  <title>Trắc Nghiệm Trung Thu Việt Nam 🥮</title>
  
  <!-- Firebase SDK v8 (Dùng CDNJS cực kỳ ổn định) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-app.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/8.10.1/firebase-database.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: rgba(30, 41, 59, 0.95);
      border: 2px solid #fbbf24;
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
    }

    h1 {
      text-align: center;
      color: #fbbf24;
      font-size: 22px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    h2 {
      text-align: center;
      color: #f59e0b;
      font-size: 18px;
      margin-bottom: 15px;
    }

    .hidden {
      display: none !important;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 16px;
      margin-bottom: 15px;
      outline: none;
    }

    input[type="text"]:focus {
      border-color: #fbbf24;
    }

    button {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: none;
      background: #f59e0b;
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.97);
      background: #d97706;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 16px;
      font-weight: bold;
      border: 1px solid #334155;
    }

    .timer {
      color: #ef4444;
      font-size: 18px;
    }

    .question-title {
      font-size: 17px;
      margin-bottom: 16px;
      line-height: 1.5;
      color: #f1f5f9;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #334155;
      color: #fff;
      text-align: left;
      border: 1px solid #475569;
      font-weight: normal;
      padding: 12px 14px;
      line-height: 1.4;
      border-radius: 8px;
    }

    .option-btn.selected {
      background: #2563eb;
      border-color: #60a5fa;
      font-weight: bold;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      font-size: 14px;
    }

    th, td {
      padding: 10px 8px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }

    th {
      color: #fbbf24;
    }

    .rank-1 { color: #ffd700; font-weight: bold; }
    .rank-2 { color: #c0c0c0; font-weight: bold; }
    .rank-3 { color: #cd7f32; font-weight: bold; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- 1. MÀN HÌNH BẮT ĐẦU -->
    <div id="start-screen">
      <h1>🥮 TRẮC NGHIỆM TRUNG THU</h1>
      <p style="text-align: center; margin-bottom: 20px; color: #cbd5e1; font-size: 15px;">
        Thử thách 30 câu hỏi ngẫu nhiên trong ngân hàng câu hỏi thuần Việt (30 phút).
      </p>
      <input type="text" id="player-name" placeholder="Nhập họ và tên..." maxlength="30" autocomplete="off">
      <button type="button" id="btn-bat-dau" onclick="batDauLamBai()">Bắt Đầu Làm Bài 🚀</button>
    </div>

    <!-- 2. MÀN HÌNH CÂU HỎI -->
    <div id="quiz-screen" class="hidden">
      <div class="quiz-header">
        <span id="question-count">Câu 1/30</span>
        <span class="timer" id="timer-display">30:00</span>
      </div>
      
      <div class="question-title" id="question-text">Đang tải câu hỏi...</div>
      
      <div class="options" id="options-container"></div>

      <button type="button" id="btn-tiep-theo" onclick="chuyenCauHoi()">Câu Tiếp Theo ➔</button>
    </div>

    <!-- 3. MÀN HÌNH KẾT QUẢ & BẢNG XẾP HẠNG -->
    <div id="result-screen" class="hidden">
      <h2>🎉 KẾT QUẢ BÀI THI</h2>
      <p style="text-align: center; font-size: 16px; margin-bottom: 8px;">
        Thí sinh: <strong id="result-name" style="color: #fbbf24;">-</strong>
      </p>
      <p style="text-align: center; font-size: 18px; margin-bottom: 20px;">
        Điểm số: <strong id="result-score" style="color: #4ade80; font-size: 22px;">0</strong> / 30 
        (<span id="result-time" style="color: #cbd5e1;">00:00</span>)
      </p>

      <h2>🏆 BẢNG XẾP HẠNG TOP 10</h2>
      <table>
        <thead>
          <tr>
            <th>#</th>
            <th>Tên</th>
            <th>Điểm</th>
            <th>Thời gian</th>
          </tr>
        </thead>
        <tbody id="leaderboard-body">
          <tr><td colspan="4" style="text-align:center;">Đang tải bảng xếp hạng...</td></tr>
        </tbody>
      </table>

      <button type="button" onclick="location.reload()" style="margin-top: 20px;">Chơi Lại 🔄</button>
    </div>

  </div>

  <script>
    // NGÂN HÀNG CÂU HỎI
    const rawQuestionBank = [
      { q: "Chú Cuội gắn liền với hình ảnh cây gì dưới gốc nguyệt?", a: ["Cây Đa", "Cây Bàng", "Cây Tre", "Cây Đào"], correct: 0 },
      { q: "Tết Trung Thu diễn ra vào ngày mấy Âm lịch hàng năm?", a: ["15/8", "15/7", "1/8", "30/8"], correct: 0 },
      { q: "Nhân vật nào thường đi kèm với Chú Cuội trên Cung Trăng?", a: ["Hằng Nga", "Tấm", "Mị Nương", "Thị Nở"], correct: 0 },
      { q: "Con vật nào được coi là bạn đồng hành cùng Hằng Nga trên Cung Trăng?", a: ["Thỏ Ngọc", "Mèo Máy", "Chó Vàng", "Cáo Tuyết"], correct: 0 },
      { q: "Thức bánh truyền thống không thể thiếu trong dịp Tết Trung Thu Việt Nam là gì?", a: ["Bánh Nướng & Bánh Dẻo", "Bánh Chưng", "Bánh Giầy", "Bánh Bò"], correct: 0 },
      { q: "Loại đèn chơi Trung Thu truyền thống nào tự quay nhờ sức nóng của nến?", a: ["Đèn Kéo Quân", "Đèn Ông Sao", "Đèn Cá Chép", "Đèn Lồng Giấy"], correct: 0 },
      { q: "Hình ảnh Lân - Sư - Rồng múa vào đêm Trung Thu tượng trưng cho điều gì?", a: ["May mắn & Thịnh vượng", "Sự xui xẻo", "Cầu mưa", "Xua đuổi mùa màng"], correct: 0 },
      { q: "Trẻ em Việt Nam thường thực hiện hoạt động nào vào đêm Rằm Trung Thu?", a: ["Rước đèn phá cỗ", "Hái lộc", "Xông nhà", "Thả hoa đăng"], correct: 0 },
      { q: "Theo truyền thuyết dân gian, Chú Cuội bị kéo lên Cung Trăng vì lý do gì?", a: ["Níu giữ cây thuốc quý", "Ước nguyện với mặt trăng", "Bị rồng tha đi", "Trèo cây hái quả"], correct: 0 },
      { q: "Đồ chơi dân gian Trung Thu làm bằng bột gạo nhuộm màu gọi là gì?", a: ["Tò he", "Búp bê", "Mặt nạ giấy", "Đèn lon"], correct: 0 },
      { q: "Tết Trung Thu còn được gọi bằng tên nào thể hiện sự đoàn tụ gia đình?", a: ["Tết Đoàn Viên", "Tết Hàn Thực", "Tết Trùng Cửu", "Tết Đoan Ngọ"], correct: 0 },
      { q: "Loại quả thường được tỉa thành hình con chó xù trong mâm cỗ Trung Thu là gì?", a: ["Quả Bưởi", "Quả Hồng", "Quả Dưa hấu", "Quả Đu đủ"], correct: 0 },
      { q: "Nhân vật bụng to, tay cầm quạt giấy nhảy múa vui vẻ cùng Kỳ Lân là ai?", a: ["Ông Địa", "Chú Cuội", "Trạng Tí", "Thần Tài"], correct: 0 },
      { q: "Tết Trung Thu ở Việt Nam xuất phát từ nền văn hóa nông nghiệp nào?", a: ["Văn minh lúa nước", "Văn minh du mục", "Văn minh công nghiệp", "Văn minh thương nghiệp"], correct: 0 },
      { q: "Lá cây thuốc của Chú Cuội trong truyền thuyết có khả năng đặc biệt gì?", a: ["Cải tử hoàn sinh", "Tăng sức mạnh", "Tàng hình", "Bay lên trời"], correct: 0 },
      { q: "Tục ngữ/dân ca Việt Nam có câu: 'Tháng Tám rước đèn...'", a: ["Phá cỗ", "Đá bóng", "Thả diều", "Trồng cây"], correct: 0 },
      { q: "Nhân bánh nướng truyền thống thập cẩm kiểu Việt Nam thường có nguyên liệu gì?", a: ["Lạp xưởng, mứt mỡ, hạt điều...", "Sô-cô-la", "Trà xanh kem", "Phô mai chảy"], correct: 0 },
      { q: "Màu sắc đặc trưng bên ngoài của vỏ Bánh Dẻo truyền thống là gì?", a: ["Màu trắng tinh / trắng ngà", "Màu nâu vàng", "Màu xanh lá", "Màu đỏ mận"], correct: 0 },
      { q: "Bài hát 'Rước đèn tháng Tám' có câu mở đầu như thế nào?", a: ["Tết Trung Thu rước đèn đi chơi", "Đêm nay trăng sáng muôn màu", "Bóng trăng tròn xòe", "Trung Thu liên hoan"], correct: 0 },
      { q: "Chiếc Đèn Ông Sao truyền thống có mấy cánh?", a: ["5 cánh", "6 cánh", "4 cánh", "8 cánh"], correct: 0 },
      { q: "Lễ hội Trung Thu lớn nhất Việt Nam với các mô hình đèn khổng lồ diễn ra ở đâu?", a: ["Tuyên Quang", "Hà Nội", "Đà Nẵng", "Cần Thơ"], correct: 0 },
      { q: "Con phố cổ nổi tiếng nhất Hà Nội về đồ chơi Trung Thu cổ truyền là gì?", a: ["Phố Hàng Mã", "Phố Tràng Tiền", "Phố Hàng Bông", "Phố Khâm Thiên"], correct: 0 },
      { q: "Trứng muối tròn đỏ trong bánh Trung Thu tượng trưng cho điều gì?", a: ["Trăng tròn viên mãn", "Mặt trời rực rỡ", "Sự may mắn", "Tiền tài"], correct: 0 },
      { q: "Trẻ em phá cỗ Trung Thu vào thời điểm nào trong ngày?", a: ["Đêm Rằm (khi trăng lên cao)", "Sáng sớm", "Buổi trưa", "Nửa đêm rạng sáng"], correct: 0 },
      { q: "Bánh Dẻo truyền thống được làm từ loại bột nào?", a: ["Bột gạo nếp rang chín", "Bột mì", "Bột năng", "Bột ngô"], correct: 0 },
      { q: "Trăng Rằm tháng Tám có đặc điểm gì nổi bật?", a: ["Tròn nhất và sáng nhất trong năm", "To nhất năm", "Có màu đỏ", "Nhỏ nhất trong năm"], correct: 0 },
      { q: "Bánh Nướng khi nướng xong có màu gì quyến rũ?", a: ["Màu nâu vàng / Cánh gián", "Màu đen tuyền", "Màu đỏ tươi", "Màu trắng ngà"], correct: 0 },
      { q: "Mâm ngũ quả Trung Thu thường có mấy loại quả tượng trưng?", a: ["5 loại quả", "3 loại quả", "7 loại quả", "10 loại quả"], correct: 0 },
      { q: "Tết Trung Thu dành riêng cho trẻ em còn gọi là Tết gì?", a: ["Tết Nhi Đồng", "Tết Hàn Thực", "Tết Nguyên Tiêu", "Tết Khai Trường"], correct: 0 },
      { q: "Bài hát 'Đêm Trung Thu' có câu 'Thùng tùng rinh rinh...' tả tiếng gì?", a: ["Tiếng trống rước đèn", "Tiếng pháo hoa", "Tiếng chuông", "Tiếng sấm"], correct: 0 }
    ];

    // BIẾN TOÀN CỤC GAME
    let db = null;
    let playerName = "";
    let selectedQuestions = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let selectedOption = null;
    let timerInterval = null;
    let totalSeconds = 1800; // 30 phút

    // KHỞI TẠO FIREBASE
    try {
      if (typeof firebase !== 'undefined' && !firebase.apps.length) {
        firebase.initializeApp({
          databaseURL: "https://dulieu-327e5-default-rtdb.asia-southeast1.firebasedatabase.app"
        });
        db = firebase.database();
      }
    } catch (e) {
      console.error("Lỗi kết nối Firebase:", e);
    }

    // NÚT BẮT ĐẦU
    function batDauLamBai() {
      const inputVal = document.getElementById('player-name').value.trim();
      if (!inputVal) {
        alert("Vui lòng nhập họ và tên của bạn!");
        return;
      }

      playerName = inputVal;

      // Chọn ngẫu nhiên 30 câu hỏi
      selectedQuestions = [...rawQuestionBank].sort(() => 0.5 - Math.random()).slice(0, 30);
      currentQuestionIndex = 0;
      score = 0;

      // Chuyển màn hình
      document.getElementById('start-screen').classList.add('hidden');
      document.getElementById('quiz-screen').classList.remove('hidden');

      // Bắt đầu đếm giờ & hiển thị câu hỏi
      chayDemGio();
      hienThiCauHoi();
    }

    // ĐẾM GIỜ
    function chayDemGio() {
      const timerDisplay = document.getElementById('timer-display');
      timerInterval = setInterval(() => {
        if (totalSeconds <= 0) {
          clearInterval(timerInterval);
          ketThucBaiThi();
          return;
        }
        totalSeconds--;
        const mins = Math.floor(totalSeconds / 60);
        const secs = totalSeconds % 60;
        timerDisplay.textContent = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }, 1000);
    }

    // HIỂN THỊ CÂU HỎI
    function hienThiCauHoi() {
      selectedOption = null;
      const currentQ = selectedQuestions[currentQuestionIndex];
      
      document.getElementById('question-count').textContent = `Câu ${currentQuestionIndex + 1}/30`;
      document.getElementById('question-text').textContent = currentQ.q;

      const container = document.getElementById('options-container');
      container.innerHTML = '';

      currentQ.a.forEach((optText, index) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = optText;
        btn.onclick = () => {
          document.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          selectedOption = index;
        };
        container.appendChild(btn);
      });

      if (currentQuestionIndex === selectedQuestions.length - 1) {
        document.getElementById('btn-tiep-theo').textContent = "Nộp Bài 🎯";
      }
    }

    // CHUYỂN CÂU HỎI
    function chuyenCauHoi() {
      if (selectedOption === null) {
        alert("Vui lòng chọn 1 đáp án!");
        return;
      }

      if (selectedOption === selectedQuestions[currentQuestionIndex].correct) {
        score++;
      }

      currentQuestionIndex++;

      if (currentQuestionIndex < selectedQuestions.length) {
        hienThiCauHoi();
      } else {
        clearInterval(timerInterval);
        ketThucBaiThi();
      }
    }

    // KẾT THÚC VÀ LƯU ĐIỂM
    function ketThucBaiThi() {
      document.getElementById('quiz-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.remove('hidden');

      const usedTimeInSeconds = 1800 - totalSeconds;
      const mins = Math.floor(usedTimeInSeconds / 60);
      const secs = usedTimeInSeconds % 60;
      const formattedTime = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

      document.getElementById('result-name').textContent = playerName;
      document.getElementById('result-score').textContent = score;
      document.getElementById('result-time').textContent = formattedTime;

      luuLênFirebase(playerName, score, usedTimeInSeconds, formattedTime);
    }

    // LƯU ĐIỂM & ĐỒNG BỘ TOP 10
    function luuLênFirebase(name, scoreVal, timeSec, formattedTime) {
      if (!db) {
        document.getElementById('leaderboard-body').innerHTML = 
          '<tr><td colspan="4" style="text-align:center;">Không thể kết nối Firebase.</td></tr>';
        return;
      }

      db.ref('leaderboard').push({
        name: name,
        score: scoreVal,
        timeUsed: timeSec,
        formattedTime: formattedTime,
        timestamp: Date.now()
      }).then(() => {
        capNhatBXH();
      }).catch((err) => {
        console.error("Lỗi lưu điểm:", err);
        capNhatBXH();
      });
    }

    // TẢI VÀ DỌN DẸP TOP 10
    function capNhatBXH() {
      if (!db) return;

      db.ref('leaderboard').once('value').then(async (snapshot) => {
        const data = snapshot.val();
        if (!data) {
          document.getElementById('leaderboard-body').innerHTML = 
            '<tr><td colspan="4" style="text-align:center;">Chưa có lượt chơi nào.</td></tr>';
          return;
        }

        let list = [];
        for (let key in data) {
          list.push({ id: key, ...data[key] });
        }

        // Sắp xếp: Điểm cao > Thời gian ít > Lượt chơi trước
        list.sort((a, b) => {
          if (b.score !== a.score) return b.score - a.score;
          if (a.timeUsed !== b.timeUsed) return a.timeUsed - b.timeUsed;
          return a.timestamp - b.timestamp;
        });

        // Tự động xóa ngoài Top 10 trên Firebase
        if (list.length > 10) {
          const deletePromises = [];
          for (let i = 10; i < list.length; i++) {
            deletePromises.push(db.ref('leaderboard/' + list[i].id).remove());
          }
          await Promise.all(deletePromises);
        }

        let top10 = list.slice(0, 10);
        let html = '';

        top10.forEach((item, index) => {
          let rankClass = '';
          if (index === 0) rankClass = 'rank-1';
          else if (index === 1) rankClass = 'rank-2';
          else if (index === 2) rankClass = 'rank-3';

          html += `
            <tr class="${rankClass}">
              <td>${index + 1}</td>
              <td>${item.name}</td>
              <td>${item.score}/30</td>
              <td>${item.formattedTime}</td>
            </tr>
          `;
        });

        document.getElementById('leaderboard-body').innerHTML = html;
      });
    }
  </script>
</body>
        </html>
